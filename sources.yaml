# Cloudflare product-specific changelog RSS feeds. These are pre-filtered at
# the publisher — every item is in-scope for the assigned pillar, so no
# keyword_filter needed. The Haiku relevance classifier still runs as a cheap
# defensive pass.

- slug: cf-changelog-ai-crawl-control
  type: rss_feed
  url: https://developers.cloudflare.com/changelog/rss/ai-crawl-control.xml
  display_name: Cloudflare AI Crawl Control changelog
  default_tracks: [crawler-controls, licensing-monetization]
  tier: primary
  role: infrastructure

- slug: cf-changelog-radar
  type: rss_feed
  url: https://developers.cloudflare.com/changelog/rss/radar.xml
  keyword_filter: ["AI", "crawler", "bot", "agent", "training"]
  display_name: Cloudflare Radar changelog
  default_tracks: [measurement-economics, crawler-controls, agentic-web]
  tier: measurement
  role: measurement
  required_for_coverage: true

# Gemini grounded-search coverage for crawler-ecosystem movement that
# never lands on vendor doc pages (third-party observation, CDN analytics,
# ecosystem commentary). References knownagents and Cloudflare Radar
# explicitly so Gemini prioritizes them when relevant.
- slug: gemini-crawler-insights
  type: gemini_search
  query: >-
    AI crawler observations, bot behavior analytics, and crawler-policy news —
    including pay-per-crawl developments, bot verification / Signed Agents adoption,
    CDN bot-management research, and publisher-side crawler actions. Include findings from
    knownagents.com/insights and radar.cloudflare.com/ai-insights where relevant,
    and any vendor announcements about new crawler UAs or scope changes.
  lookback_days: 30
  display_name: Crawler insights (search)
  default_tracks: [crawler-controls, agentic-web, measurement-economics]
  tier: commentary
  role: reporting

