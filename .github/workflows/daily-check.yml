name: Daily Check

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python
        run: uv python install 3.12

      - name: Sync deps
        run: uv sync --frozen

      - name: Run daily check
        id: daily_check
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_ANALYSIS_MODEL: gemini-3.7-flash
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_DISCOVERY_MODEL: grok-4.6
          XAI_MAX_DAILY_SEARCH_CALLS: "6"
          XAI_MONTHLY_SOFT_BUDGET_USD: "10"
          PUBLICATION_CUTOFF: "2026-08-30T00:00:00Z"
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_CRAWLER_API_KEY: ${{ secrets.CLOUDFLARE_CRAWLER_API_KEY }}
          ALERT_EMAILS: ${{ secrets.ALERT_EMAILS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python -m pipeline.check

      - name: Commit + push if changed
        if: always()
        run: |
          git config user.name "ai-ecosystem-tracker[bot]"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "daily-check $(date -u +%F): auto-run"
          # main has a second writer now: a merge of map/proposals or
          # map/readings between this job's checkout and this push rejects a
          # bare push with nothing to retry it, silently losing this run's
          # feed items, snapshots and proposals. Rebase onto the latest main
          # and retry a bounded number of times instead of force-pushing.
          attempt=1
          max_attempts=5
          until git push origin HEAD:${{ github.ref_name }}; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::push to ${{ github.ref_name }} failed after $attempt attempts"
              exit 1
            fi
            attempt=$((attempt + 1))
            echo "push rejected; fetching and rebasing (attempt $attempt/$max_attempts)"
            git fetch origin ${{ github.ref_name }}
            git rebase origin/${{ github.ref_name }}
          done

      - name: Preserve critical pipeline outcome
        if: always() && steps.daily_check.outcome == 'failure'
        run: exit 1
