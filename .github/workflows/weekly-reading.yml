name: Weekly Intelligence

on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays at 13:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-intelligence
  cancel-in-progress: false

jobs:
  intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python
        run: uv python install 3.12

      - name: Sync deps
        run: uv sync --frozen

      - name: Build weekly intelligence
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_ANALYSIS_MODEL: gemini-3.7-flash
        run: uv run python -m pipeline.weekly_intelligence

      - name: Commit + push if changed
        run: |
          git config user.name "ai-ecosystem-tracker[bot]"
          git config user.email "bot@users.noreply.github.com"
          git add data/intelligence data/trends.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "weekly-intelligence $(date -u +%G-W%V): auto-run"
            git push origin HEAD:${{ github.ref_name }}
          fi
